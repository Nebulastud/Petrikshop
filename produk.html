<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Petrik Shop - Toko Online 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="scene-bg" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="cube cube-1"></span>
    <span class="cube cube-2"></span>
  </div>

  <header class="page-header">
    <span class="eyebrow">🛍️ Halaman Produk</span>
    <h1>Produk Petrik Shop</h1>
    <p>Pilih produk favorit Anda, cari berdasarkan nama, atau filter lewat kategori.</p>
  </header>

  <main>
    <section class="controls">
      <input type="text" id="search-input" placeholder="Cari produk..." />
      <select id="category-filter">
        <option value="all">Semua Kategori</option>
      </select>
    </section>

    <section id="product-list" class="product-list"></section>
  </main>


  <nav class="bottom-nav" aria-label="Menu bawah">
    <a class="nav-link" href="index.html" data-page="home">
      <span class="nav-icon">🏠</span>
      <span>HOME</span>
    </a>
    <a class="nav-link" href="produk.html" data-page="produk">
      <span class="nav-icon">🛍️</span>
      <span>PRODUK</span>
    </a>
    <a class="nav-link" href="support.html" data-page="support">
      <span class="nav-icon">🎧</span>
      <span>SUPPORT</span>
    </a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
